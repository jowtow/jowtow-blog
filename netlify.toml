[build]
  command = "npm run build"
  publish = ".next"

[context.production]
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "production" }

[identity]
  provider = "netlify"

[[redirects]]
  from = "/.netlify/functions/identity/*"
  to = "/.netlify/identity"
  status = 200
